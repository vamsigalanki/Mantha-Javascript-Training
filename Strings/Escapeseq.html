Escape sequences are special characters used inside strings to represent characters that are otherwise difficult to include directly, like newlines or quotes.

\n: Newline
\t: Tab
\\: Backslash
\': Single quote
\": Double quote

<html>
    <head></head>
    <body>
        <script>
            let text="hello,\nworld";
            
            console.log(text)
        </script>
    </body>
</html>
