String Interpolation (Template Literals)
Template literals allow embedding variables and expressions directly into the string using ${}.
<html>
    <head></head>
    <body>
        <script>
            let name = "John";
                let greeting = `Hello, ${name}!`;  // Interpolates the variable 'name'
                console.log(greeting);  // Output: Hello, John!

        </script>
    </body>
</html>
