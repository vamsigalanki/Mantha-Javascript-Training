what is funcion expression?
The Javascript Function Expression is used to define a function inside any expression.
   
  <!DOCTYPE html>
  <html lang="en">
  <head>
   
    <title>function expression</title>
  </head>
  <body>
    <script>
            const sum=function(a,b){
                    return a+b;
            }
            console.log(sum(6,3)); //output=9
    </script>
  </body>
  </html>
