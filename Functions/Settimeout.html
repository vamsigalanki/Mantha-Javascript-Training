what is SetTimeOut?
 this function is used to delay the execution of a function or the evaluation of an expression after a specified amount of time in milliseconds.

 <html>
    <head></head>
    <body>
        <script>
            setTimeout (function(){
                console.log("vamsi")
                },2000);   //after 2 sec vamsi

        </script>
    </body>
 </html>
