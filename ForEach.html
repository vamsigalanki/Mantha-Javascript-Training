what is forEach?
In JavaScript, forEach() is a method used to iterate over elements in an array. It executes a provided function once for each array element.

<html>
    <head></head>
    <body>
        <script>
            const fruits = ["apple", "banana", "cherry"];

                        fruits.forEach(function(e,i) {    //element,index,array
                        console.log(e);
                        });  // Output:// apple, 
                                       //banana,
                                       //cherry

                        
                    
                        
                        

        </script>
    </body>
</html>
