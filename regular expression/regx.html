Regular Expressions :-
In Javascript , Regular Expression ( regex ) is a pattern used to match and
manipulate the text .
 
syntax: /hi/

Testing for matching :- The test() method returns true if the string argument contains a match
  <html>
    <head></head>
    <body>
        <script>
            let re=/hi/;
            let result=re.test('hi john');
            console.log(result);
        </script>
    </body>
  </html>
